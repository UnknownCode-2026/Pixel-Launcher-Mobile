name: Apply Pixel Community Branding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher-api/pixel_logo.png'
      - '.github/workflows/apply-pixel-branding.yml'
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create launcher logo and Android icon assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          logo = Path('launcher-api/pixel_logo.png')
          if not logo.is_file():
              raise FileNotFoundError(f'Missing logo: {logo}')
          with Image.open(logo) as im:
              source = im.convert('RGBA')
          # Main in-app logo: preserve complete artwork and original proportions.
          out = Path('app/src/main/res/drawable/logo_head.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          art = source.copy()
          art.thumbnail((960, 480), Image.Resampling.LANCZOS)
          art.save(out, 'PNG')
          # Adaptive icon layers and legacy icons for every Android density.
          densities = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for density, px in densities.items():
              folder = Path(f'app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              for name, size, ratio in [
                  ('ic_launcher.png',px,.84),
                  ('ic_launcher_round.png',px,.84),
                  ('ic_launcher_foreground.png',int(px*108/48),.56),
                  ('ic_launcher_background.png',int(px*108/48),0),
              ]:
                  if ratio:
                      canvas = Image.new('RGBA',(size,size),'#FFFFFF')
                      fitted = source.copy()
                      fitted.thumbnail((int(size*ratio),int(size*ratio)),Image.Resampling.LANCZOS)
                      canvas.alpha_composite(fitted,((size-fitted.width)//2,(size-fitted.height)//2))
                  else:
                      canvas = Image.new('RGBA',(size,size),'#FFFFFF')
                  canvas.save(folder/name,'PNG')
          PY
      - name: Commit generated branding assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable/logo_head.png app/src/main/res/mipmap-*/
          if ! git diff --cached --quiet; then
            git commit -m "Apply Pixel Community logo to launcher and Android icons"
            git push
          fi
