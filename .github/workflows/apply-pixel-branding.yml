name: Apply Pixel Community Branding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher-api/Messenger_creation_133AACBE-0E96-41CE-8885-40C9F4AB7230.png'
      - '.github/workflows/apply-pixel-branding.yml'
permissions:
  contents: write
  actions: write
jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove logo background and generate all launcher icons
        run: |
          python -m pip install --quiet Pillow "rembg[cpu]"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from rembg import remove, new_session
          original = Path('launcher-api/Messenger_creation_133AACBE-0E96-41CE-8885-40C9F4AB7230.png')
          if not original.is_file():
              raise FileNotFoundError(original)
          source = remove(Image.open(original).convert('RGBA'), session=new_session('u2net'))
          bounds = source.getchannel('A').getbbox()
          if bounds is None:
              raise ValueError('Background removal produced an empty logo')
          source = source.crop(bounds)
          logo = Path('launcher-api/pixel_logo.png')
          source.save(logo, 'PNG')
          head = Path('app/src/main/res/drawable/logo_head.png')
          art = source.copy()
          art.thumbnail((960,480),Image.Resampling.LANCZOS)
          art.save(head,'PNG')
          densities = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, px in densities.items():
              folder = Path(f'app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True,exist_ok=True)
              for name, size, ratio in [
                  ('ic_launcher.png',px,.84),
                  ('ic_launcher_round.png',px,.84),
                  ('ic_launcher_foreground.png',round(px*108/48),.56),
                  ('ic_launcher_background.png',round(px*108/48),0)
              ]:
                  canvas = Image.new('RGBA',(size,size),(255,255,255,255))
                  if ratio:
                      fitted=source.copy()
                      fitted.thumbnail((int(size*ratio),int(size*ratio)),Image.Resampling.LANCZOS)
                      canvas.alpha_composite(fitted,((size-fitted.width)//2,(size-fitted.height)//2))
                  canvas.save(folder/name,'PNG')
          PY
      - name: Commit new logo and generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher-api/pixel_logo.png app/src/main/res/drawable/logo_head.png app/src/main/res/mipmap-*/
          if ! git diff --cached --quiet; then
            git commit -m "Replace Pixel Community logo with transparent new artwork"
            git push
          fi
      - name: Build APK with new branding
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-debug.yml --ref main
