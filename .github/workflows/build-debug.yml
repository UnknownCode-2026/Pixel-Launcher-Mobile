name: Build Pixel Launcher Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/build-debug.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 29 and build tools 30.0.3
        run: sdkmanager "platforms;android-29" "build-tools;30.0.3"
      - name: Gradle wrapper permissions
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Launcher-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
