name: Convert Pixel logo to PNG
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-pixel-logo.yml'
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert JPEG into real PNG and rename
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('launcher-api/Messenger_creation_Q8HtBAJ853k1Jpl97o-YgeYZ_D9fGL9mPP2DtVxOM4vznTqnUjso7utuLF8TDJ46fRa0fpiGV38Q-AiZ3QcGxBd64fyzXgB8XPKb.jpeg')
          destination = Path('launcher-api/pixel_logo.png')
          if source.exists():
              with Image.open(source) as im:
                  im.convert('RGBA').save(destination, 'PNG')
              source.unlink()
          elif not destination.exists():
              raise FileNotFoundError(source)
          PY
      - name: Commit renamed logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A launcher-api/
          if ! git diff --cached --quiet; then
            git commit -m "Convert and rename Pixel Community logo to pixel_logo.png"
            git push
          fi
