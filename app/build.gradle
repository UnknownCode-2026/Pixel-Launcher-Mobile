apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
//apply plugin: 'me.tatarka.retrolambda'

android {
    compileSdkVersion 29
    buildToolsVersion "30.0.3"

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 27
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        applicationId "th.samp.launcher"
        versionName "1.0.0"
        versionCode 58
        multiDexEnabled true
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.hzy:libp7zip:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation "androidx.constraintlayout:constraintlayout:2.1.2"
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.liulishuo.filedownloader:library:1.7.7'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'io.github.dinuscxj:circleprogressbar:1.4.1'
    implementation platform('com.google.firebase:firebase-bom:28.3.0')
    implementation 'com.google.firebase:firebase-core:16.0.1'
    implementation 'com.google.firebase:firebase-messaging:23.0.2'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-auth:16.0.1'
    implementation 'com.google.firebase:firebase-database:16.0.1'
    implementation "com.google.android.gms:play-services-base:17.5.0"
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.github.bumptech.glide:glide:4.13.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.agrawalsuneet.androidlibs:dotsloader:1.4'
    implementation 'com.tuyenmonkey:mkloader:1.4.0'
    implementation 'com.github.ceryle:RadioRealButton:v2.1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'ru.egslava:MaskedEditText:1.0.5'
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation "com.github.skydoves:colorpickerpreference:2.0.4"
    implementation 'com.github.smarteist:Android-Image-Slider:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout-core:1.0.3'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.yandex.android:mobmetricalib:5.0.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'
    implementation 'org.solovyev.android:checkout:1.2.1'
    implementation 'ru.egslava:MaskedEditText:1.0.5'
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation "com.github.skydoves:colorpickerpreference:2.0.4"
    implementation 'commons-io:commons-io:2.6'
    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"
    implementation 'net.lingala.zip4j:zip4j:2.10.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    testImplementation 'junit:junit:4.12'
}


android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "launcher.apk"
    }
    variant.assembleProvider.configure { assemble ->
        assemble.doLast {
            delete "$projectDir\\result\\"

            copy {
                from variant.outputs*.outputFile
                into "$projectDir\\..\\result\\"
            }
        }
    }
}